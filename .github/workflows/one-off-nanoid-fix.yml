name: One-off NanoID dependency repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'investigative-workbench-overhaul'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: investigative-workbench-overhaul

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply safe audit repair
        shell: bash
        run: |
          npm audit fix --omit=dev || true
          if ! npm audit --omit=dev --audit-level=high; then
            npm pkg set overrides.nanoid=5.1.16
            npm install --package-lock-only
          fi
          npm audit --omit=dev --audit-level=high

      - name: Commit dependency metadata if changed
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency metadata changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Fix NanoID production dependency advisory"
          git push origin HEAD:investigative-workbench-overhaul
