name: Repair Router Lock

on:
  push:
    branches:
      - investigative-workbench-overhaul

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workbench branch
        uses: actions/checkout@v4
        with:
          ref: investigative-workbench-overhaul

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate secure router lock
        run: npm install react-router-dom@7.18.2 --save --package-lock-only

      - name: Commit regenerated dependency metadata
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency metadata already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade React Router to patched 7.18.2"
          git push origin HEAD:investigative-workbench-overhaul
