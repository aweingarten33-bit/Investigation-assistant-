name: One-off PDF.js lockfile repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'investigative-workbench-overhaul'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: investigative-workbench-overhaul

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Update lockfile for exact patched PDF.js
        run: npm install --package-lock-only

      - name: Verify production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock patched PDF.js dependency"
          git push origin HEAD:investigative-workbench-overhaul
