name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Install
        run: npm ci

      - name: Server syntax
        run: npm run check:server

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Live investigation AI evaluation suite (when provider secret is configured)
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          CLASSIFICATION_SIGNING_SECRET: ${{ secrets.CLASSIFICATION_SIGNING_SECRET }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$OPENAI_API_KEY" ] || [ -n "$GEMINI_API_KEY" ]; then
            npm run eval:ai
          else
            echo "Live AI eval skipped: no provider API key is configured in GitHub Actions. Deterministic AI-eval scoring tests still ran in npm test."
          fi
