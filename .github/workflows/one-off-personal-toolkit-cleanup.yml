name: One-off personal toolkit consistency cleanup

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'investigative-workbench-overhaul'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: investigative-workbench-overhaul

      - name: Apply personal-use toolkit cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected text in {path}: {old[:80]}')
              p.write_text(text.replace(old, new))

          replace(
              'src/components/toolkit/DecisionFramework.tsx',
              'Manual Decision Framework',
              'Decision Framework',
          )

          guide = Path('src/components/toolkit/InvestigationGuide.tsx')
          text = guide.read_text()
          replacements = {
              'Start with the complainant → then witnesses → then the subject LAST':
                  'Sequence interviews strategically: often complainant → key witnesses → subject after enough facts are gathered, but adjust for safety, evidence preservation, fairness, policy, or counsel direction',
              'Interview the subject last so you have facts to work with':
                  'Interview the subject when you have enough reliable facts to ask focused questions; do it earlier when delay could create safety, preservation, fairness, or due-process problems',
              'Always interview the subject LAST. You want all the facts before you sit down with them.':
                  'The subject is often interviewed after key objective evidence and witness accounts are gathered, but there is no universal “always last” rule.',
              'Get the evidence BEFORE you interview anyone. You want facts in hand before asking questions.':
                  'Collect readily available objective evidence early, while preserving flexibility to interview promptly when delay could harm the investigation.',
              'ALWAYS: CCO, Legal Counsel, person who assigned the investigation':
                  'NEED-TO-KNOW: distribute only to the roles required by policy, legal direction, governance, or the person who assigned the investigation',
              'IF SUBSTANTIATED: + department leadership, HR, Compliance Committee, possibly Board':
                  'IF SUBSTANTIATED: consider HR, relevant leadership, Compliance Committee, or Board only when policy, governance, risk, or the corrective-action process requires it',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected Guide text: {old}')
              text = text.replace(old, new)
          guide.write_text(text)

          interviews = Path('src/components/toolkit/InterviewTemplates.tsx')
          text = interviews.read_text()
          interview_replacements = {
              'badge: "Do This Last"': 'badge: "Usually Later"',
              'when: "For the person being investigated. ALWAYS interview them LAST after you have all the facts."':
                  'when: "For the person being investigated. Often interview after enough objective facts are gathered to ask focused questions, unless safety, preservation, fairness, policy, or counsel requires an earlier interview."',
          }
          for old, new in interview_replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected Interview text: {old}')
              text = text.replace(old, new)
          interviews.write_text(text)

          coi = Path('src/components/toolkit/ConflictOfInterest.tsx')
          text = coi.read_text()

          matrix = '''const COI_MATRIX = [
  { disclosed: "Yes", influenced: "No", result: "Manage the conflict", note: "Disclosure is a control success. Use recusal, monitoring, or another management plan as appropriate; discipline is not automatic." },
  { disclosed: "Yes", influenced: "Yes", result: "Investigate impact", note: "Assess why the person remained involved, what decisions were affected, and whether policy or the management plan was violated." },
  { disclosed: "No", influenced: "No", result: "Disclosure failure", note: "A disclosure-policy violation may be substantiated, but corrective action depends on intent, training, policy, precedent, and prior history." },
  { disclosed: "No", influenced: "Yes", result: "Serious review", note: "Undisclosed conflict plus influenced decisions is serious; assess intent, impact, personal benefit, precedent, and HR/Legal requirements." },
  { disclosed: "No", influenced: "Yes + Personal Gain", result: "Escalate for HR/Legal/fraud review", note: "Self-dealing or deliberate personal gain can put termination and legal/remedial action within the review range, but it is not an automatic outcome." },
];'''
          text, n = re.subn(r'const COI_MATRIX = \[.*?\n\];', matrix, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace COI_MATRIX')

          discipline = '''const COI_DISCIPLINE = [
  {
    level: "Manage / Educate",
    color: "text-success",
    bg: "bg-success/10",
    border: "border-success/30",
    when: "Often appropriate when the conflict was disclosed, no improper influence is established, and the issue can be effectively controlled.",
    actions: [
      "Update the disclosure and document the management plan",
      "Use recusal, monitoring, or role limitations suited to the actual conflict",
      "Provide targeted education when a knowledge gap contributed",
      "Document why the chosen control is sufficient",
    ],
  },
  {
    level: "Formal Corrective Action May Be Appropriate",
    color: "text-warning",
    bg: "bg-warning/10",
    border: "border-warning/30",
    when: "Consider when a disclosure or management requirement was violated, after checking intent, training, policy language, prior history, and precedent.",
    actions: [
      "Confirm the exact policy requirement and whether the employee was trained on it",
      "Compare materially similar precedent before selecting an action",
      "Strengthen the COI management plan and recusal controls",
      "Use HR review when formal employment action is being considered",
    ],
  },
  {
    level: "Serious Corrective Action / Suspension May Be Considered",
    color: "text-orange-600",
    bg: "bg-orange-500/10",
    border: "border-orange-500/30",
    when: "Consider when an undisclosed or unmanaged conflict materially influenced decisions, a prior management plan was violated, or significant organizational/patient risk resulted.",
    actions: [
      "Remove the individual from conflicted decisions while review is pending when appropriate",
      "Review affected contracts, referrals, hiring, procurement, or other decisions",
      "Assess financial/patient/program impact and remediation",
      "Apply policy, precedent, CBA/union rules, and HR/Legal review before final action",
    ],
  },
  {
    level: "Termination / Legal Action May Be Within the Review Range",
    color: "text-destructive",
    bg: "bg-destructive/10",
    border: "border-destructive/30",
    when: "Potentially relevant for deliberate concealment, self-dealing, fraud, significant personal gain, repeated violation of a management plan, or other severe facts supported by evidence.",
    actions: [
      "Do not treat termination as automatic",
      "Preserve evidence and review the full scope of affected decisions",
      "Quantify financial or program harm and consider recovery/remediation",
      "Evaluate applicable fraud, tax, referral, payer, or law-enforcement issues with Legal",
      "Use authorized HR/leadership decision-making and any required labor process before final employment action",
    ],
  },
];'''
          text, n = re.subn(r'const COI_DISCIPLINE = \[.*?\n\];', discipline, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace COI_DISCIPLINE')

          text = text.replace('Quick Decision Matrix', 'COI Decision Factors')
          text = text.replace('discipline guidance', 'corrective-action considerations')
          text = text.replace('Discipline Guidance', 'Corrective-Action Considerations')
          coi.write_text(text)
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/toolkit/DecisionFramework.tsx src/components/toolkit/InvestigationGuide.tsx src/components/toolkit/InterviewTemplates.tsx src/components/toolkit/ConflictOfInterest.tsx
          git commit -m "Align toolkit guidance with personal investigation workflow"
          git push origin HEAD:investigative-workbench-overhaul