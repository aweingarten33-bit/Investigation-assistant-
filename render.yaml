services:
  - type: web
    runtime: node
    name: investigation-assistant
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: CLASSIFICATION_SIGNING_SECRET
        sync: false
