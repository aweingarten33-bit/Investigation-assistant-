services:
  - type: web
    runtime: node
    name: investigation-assistant
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Which AI backend to use. Defaults to anthropic if unset — only set
      # this if you're switching providers. Only the key/model pair for
      # whichever provider you pick needs a real value; leave the rest blank.
      - key: AI_PROVIDER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: CLASSIFICATION_SIGNING_SECRET
        sync: false
      # Required: access key for the Lead Investigator API. Without it the
      # server refuses all /api/investigations requests in production.
      - key: INVESTIGATIONS_API_KEY
        sync: false
      # Lead Investigator cases are stored in a local SQLite file
      # (data/investigation-graph.sqlite). Without a persistent disk, cases
      # are lost on each deploy. Optionally set INVESTIGATION_GRAPH_DB_PATH
      # to a file on an attached disk to keep them.
